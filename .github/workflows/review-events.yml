name: PR review events

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      # Fork review events have a read-only token. The default-branch
      # Review policy workflow rechecks GitHub's review data on completion.
      - run: echo "Review changed; requesting a policy recheck."
